<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 30px 'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif; fill: #0f172a; }
    .sub { font: 18px 'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif; fill: #475569; }
    .box { stroke-width: 2; rx: 10; }
    .in { fill: #dbeafe; stroke: #2563eb; }
    .demux { fill: #e0f2fe; stroke: #0284c7; }
    .bank { fill: #f8fafc; stroke: #475569; }
    .q { fill: #ffedd5; stroke: #ea580c; }
    .arb { fill: #dcfce7; stroke: #16a34a; }
    .out { fill: #ede9fe; stroke: #7c3aed; }
    .label { font: 600 20px 'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif; fill: #0f172a; }
    .small { font: 16px 'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif; fill: #334155; }
    .tiny { font: 14px 'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif; fill: #64748b; }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .back { stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow-back); }
    .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 8; }
  </style>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" class="title">Per-crosspoint FIFO: 2x2 共 4 个缓冲点</text>
  <text x="600" y="82" text-anchor="middle" class="sub">Phase 3 planned · input demux → XP[in][out] FIFO → output mux/arbiter</text>

  <!-- inputs -->
  <rect class="box in" x="35" y="180" width="145" height="90"/>
  <text x="107" y="218" text-anchor="middle" class="label">Input 0</text>
  <text x="107" y="246" text-anchor="middle" class="small">src 0</text>

  <rect class="box in" x="35" y="460" width="145" height="90"/>
  <text x="107" y="498" text-anchor="middle" class="label">Input 1</text>
  <text x="107" y="526" text-anchor="middle" class="small">src 1</text>

  <!-- demux -->
  <rect class="box demux" x="220" y="180" width="130" height="90"/>
  <text x="285" y="218" text-anchor="middle" class="label">demux</text>
  <text x="285" y="246" text-anchor="middle" class="tiny">by dst</text>

  <rect class="box demux" x="220" y="460" width="130" height="90"/>
  <text x="285" y="498" text-anchor="middle" class="label">demux</text>
  <text x="285" y="526" text-anchor="middle" class="tiny">by dst</text>

  <!-- XP bank -->
  <rect class="box bank" x="400" y="120" width="390" height="480"/>
  <text x="595" y="160" text-anchor="middle" class="label">Crosspoint FIFO array</text>
  <text x="595" y="186" text-anchor="middle" class="tiny">4 × FIFO · depth C flits each</text>

  <rect class="box q" x="430" y="225" width="150" height="90"/>
  <text x="505" y="258" text-anchor="middle" class="small">XP[0][0]</text>
  <text x="505" y="282" text-anchor="middle" class="tiny">in0 → out0</text>

  <rect class="box q" x="610" y="225" width="150" height="90"/>
  <text x="685" y="258" text-anchor="middle" class="small">XP[0][1]</text>
  <text x="685" y="282" text-anchor="middle" class="tiny">in0 → out1</text>

  <rect class="box q" x="430" y="405" width="150" height="90"/>
  <text x="505" y="438" text-anchor="middle" class="small">XP[1][0]</text>
  <text x="505" y="462" text-anchor="middle" class="tiny">in1 → out0</text>

  <rect class="box q" x="610" y="405" width="150" height="90"/>
  <text x="685" y="438" text-anchor="middle" class="small">XP[1][1]</text>
  <text x="685" y="462" text-anchor="middle" class="tiny">in1 → out1</text>

  <!-- output arbiters -->
  <rect class="box arb" x="850" y="190" width="210" height="150"/>
  <text x="955" y="235" text-anchor="middle" class="label">out0 mux + arbiter</text>
  <text x="955" y="265" text-anchor="middle" class="small">packet-granular RR</text>
  <text x="955" y="291" text-anchor="middle" class="tiny">从 XP[0][0] / XP[1][0] 选包</text>

  <rect class="box arb" x="850" y="450" width="210" height="150"/>
  <text x="955" y="495" text-anchor="middle" class="label">out1 mux + arbiter</text>
  <text x="955" y="525" text-anchor="middle" class="small">packet-granular RR</text>
  <text x="955" y="551" text-anchor="middle" class="tiny">从 XP[0][1] / XP[1][1] 选包</text>

  <!-- outputs -->
  <rect class="box out" x="1100" y="220" width="80" height="90"/>
  <text x="1140" y="258" text-anchor="middle" class="label">out0</text>
  <text x="1140" y="286" text-anchor="middle" class="small">dst 0</text>

  <rect class="box out" x="1100" y="480" width="80" height="90"/>
  <text x="1140" y="518" text-anchor="middle" class="label">out1</text>
  <text x="1140" y="546" text-anchor="middle" class="small">dst 1</text>

  <!-- data arrows -->
  <line class="arrow" x1="180" y1="225" x2="215" y2="225"/>
  <line class="arrow" x1="180" y1="505" x2="215" y2="505"/>
  <line class="arrow" x1="350" y1="225" x2="425" y2="255"/>
  <line class="arrow" x1="350" y1="225" x2="590" y2="255"/>
  <line class="arrow" x1="350" y1="505" x2="425" y2="445"/>
  <line class="arrow" x1="350" y1="505" x2="590" y2="445"/>
  <line class="arrow" x1="580" y1="270" x2="845" y2="250"/>
  <line class="arrow" x1="580" y1="450" x2="845" y2="300"/>
  <line class="arrow" x1="760" y1="270" x2="845" y2="500"/>
  <line class="arrow" x1="760" y1="450" x2="845" y2="530"/>
  <line class="arrow" x1="1060" y1="265" x2="1095" y2="265"/>
  <line class="arrow" x1="1060" y1="525" x2="1095" y2="525"/>

  <!-- backpressure note -->
  <path class="back" d="M400 300 L355 300 L355 270"/>
  <path class="back" d="M400 480 L355 480 L355 550"/>
  <text x="365" y="325" class="tiny">target XP full</text>
  <text x="365" y="575" class="tiny">target XP full</text>

  <rect class="note" x="35" y="625" width="1130" height="65"/>
  <text x="55" y="655" class="small">每个 (input, output) 一个 FIFO；输入按 dst 写入对应交叉点，输出从本列两个 FIFO 中按包选择。</text>
  <text x="55" y="680" class="small">XP 解耦输入/输出仲裁，但面积是 4 个 FIFO；Phase 3 与 FIFO/VOQ 做同总 buffer 对比。</text>
</svg>
